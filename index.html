<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3e6d4" />
    <title>Puppy · 3D</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 20%, #fdf6ec 0%, #f3e6d4 55%, #e2cdb4 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      #veil {
        position: fixed;
        inset: 0;
        background: #f3e6d4;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.7s ease, visibility 0.7s;
        pointer-events: none;
      }
      #veil.hide { opacity: 0; visibility: hidden; }
      .paw {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #c08a52;
        position: relative;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .paw::before, .paw::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        background: inherit;
      }
      .paw::before { width: 18px; height: 18px; top: -12px; left: 6px; box-shadow: 14px 0 0 #c08a52; animation: inherit; }
      @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.7 } 50% { transform: scale(1); opacity: 1 } }

      #hint {
        position: fixed;
        bottom: max(18px, env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        color: #8a6a48;
        font-size: 13px;
        letter-spacing: 0.04em;
        z-index: 5;
        pointer-events: none;
        transition: opacity 1s ease;
      }
      #hint.fade { opacity: 0; }

      #title {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 20px;
        color: #7a5a38;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.06em;
        z-index: 5;
        pointer-events: none;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="title">Bear</div>
    <div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll or pinch to zoom</div>
    <div id="veil"><div class="paw"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
